name: Android CI

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.3.1"

      - name: Production anti-fake gate
        run: bash ./scripts/verify-production.sh

      - name: Unit tests
        run: gradle testDebugUnitTest

      - name: Lint
        run: gradle lintDebug

      - name: Assemble debug
        run: gradle assembleDebug
